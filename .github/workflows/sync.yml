name: Sync Resume

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:
  push:

jobs:
  fetch-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: Subh85330/overleaf-resume@main
        with:
          overleaf_url: 'https://www.overleaf.com/read/czdjsmmvmfgd#294de7'
          # overleaf_url: ${{ vars.OVERLEAF_URL }}

          # Optional
          gdrive_link: ${{ vars.GDRIVE_LINK }}
          gdrive_service_account_key: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
